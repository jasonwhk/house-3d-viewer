<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101412" />
    <title>House 3D Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">INTERACTIVE MODEL</p>
          <h1>House 3D Viewer</h1>
        </div>
        <div class="status" id="status"><span></span> Loading model</div>
      </header>

      <aside class="panel">
        <section>
          <p class="section-title">View</p>
          <div class="segmented" id="floor-controls">
            <button class="active" data-floor="all">Whole house</button>
            <button data-floor="1">Floor 1</button>
            <button data-floor="2">Floor 2</button>
            <button data-floor="3">Floor 3</button>
          </div>
        </section>
        <section>
          <p class="section-title">Layers</p>
          <label class="switch-row">
            <span><strong>Ceilings</strong><small>Hide for dollhouse view</small></span>
            <input id="ceilings" type="checkbox" checked />
          </label>
        </section>
        <section class="selection-section">
          <p class="section-title">Selection</p>
          <div class="selection-empty" id="selection-empty">Click a wall, door, window or fixture.</div>
          <dl class="selection-info" id="selection-info" hidden>
            <div><dt>Object</dt><dd id="selected-name">—</dd></div>
            <div><dt>Type</dt><dd id="selected-type">—</dd></div>
            <div><dt>Floor</dt><dd id="selected-floor">—</dd></div>
          </dl>
          <button class="clear-selection" id="clear-selection" hidden>Clear selection</button>
        </section>
        <button class="reset" id="reset">Reset camera</button>
      </aside>

      <div id="canvas-wrap"></div>
      <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan · Click to inspect</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
