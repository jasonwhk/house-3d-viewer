name: Apply interactive build-mode upgrade
on:
  push:
    paths:
      - scripts/upgrade-build-mode.py
      - .github/workflows/apply-build-mode.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: python scripts/upgrade-build-mode.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css index.html
          git commit -m "Add interactive walls stairs and outdoor walking"
          git push
